name: publish

# Publishes to PyPI on version tags (v0.1.0, ...) using Trusted Publishing (OIDC).
# One-time setup: PyPI project Settings -> Publishing -> add this repo + workflow.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write  # required for trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build backend
        run: pip install build
      - name: Build
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
